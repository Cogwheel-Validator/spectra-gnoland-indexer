# git-cliff configuration for spectra-gnoland-indexer
# Tuned to the existing CHANGELOG.md style (Keep a Changelog + Added/Changes/Fixed).
#
# Commit messages are expected to be strict Conventional Commits
# (https://www.conventionalcommits.org/en/v1.0.0/): `type(scope)!: description`.
# GitHub squash-merges append " (#NN)" to the subject line; that reference is
# rewritten into a link to the PR itself (see commit_preprocessors below).
#
# Release workflow example:
#   1. Preview:   git cliff --unreleased --tag v0.7.1
#   2. Prepend:   git cliff --unreleased --tag v0.7.1 --prepend CHANGELOG.md
#   3. Edit the new section: add a release summary paragraph below the heading.
#   4. Commit:    git add CHANGELOG.md && git commit -m "chore: release v0.7.1"
#   5. Tag:       git tag -a v0.7.1 -m "v0.7.1" && git push --follow-tags

[changelog]
# Static header — only emitted when regenerating the full file (-o), not on --prepend.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# How each release block is rendered.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.id %} [{{ commit.id | truncate(length=7, end="") }}](https://github.com/Cogwheel-Validator/spectra-gnoland-indexer/commit/{{ commit.id }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Don't drop non-conforming commits route them to the catch-all group below so nothing
# silently vanishes; a full "Uncategorized" section is a signal to fix commit hygiene, not hide it.
filter_unconventional = false
split_commits = false
# Breaking commits are never dropped by another parser matching first.
protect_breaking_commits = true

commit_preprocessors = [
  # Strip a trailing period from the subject — the type prefix stays so parsers can see it.
  { pattern = '\.\s*$', replace = "" },
  # GitHub squash-merge appends " (#NN)" to the subject — turn it into a link to the PR.
  { pattern = '(?m)\(#(\d+)\)[ \t]*$', replace = "([#$1](https://github.com/Cogwheel-Validator/spectra-gnoland-indexer/pull/$1))" },
]

# Parsers match against the FULL commit message (including type prefix).
# (\([^)]+\))? handles optional scopes: both "feat:" and "feat(api):" are matched.
# The <!-- N --> markers control section sort order (lower number = higher in the output).
commit_parsers = [
  # Breaking changes (type(scope)!: ... or a BREAKING CHANGE: footer) always come first.
  { message = '^\s*(?i)[a-z]+(\([^)]+\))?!:', group = "<!-- -1 -->Breaking Changes" },
  { footer = '^(?i)BREAKING[ -]CHANGE', group = "<!-- -1 -->Breaking Changes" },
  { message = '^\s*(?i)(feat|feature|add|added)(\([^)]+\))?:',                                                                    group = "<!-- 0 -->Added" },
  { message = '^\s*(?i)(fix|bug ?fix|fixed)(\([^)]+\))?:',                                                                        group = "<!-- 2 -->Fixed" },
  { message = '^\s*(?i)(change|changed|chore|deps|dep|refactor|refac|lint|go fmt|go fix|perf|docs|doc|build|ci|style|revert)(\([^)]+\))?:', group = "<!-- 1 -->Changes" },
  { message = '^\s*(?i)(test|audit|vulncheck|vuln)(\([^)]+\))?:',                                                                 group = "<!-- 3 -->Tests and Code Check" },
  # Catch-all so nothing silently vanishes — triage these before releasing.
  { message = '.*', group = "<!-- 4 -->Uncategorized (please triage)" },
]

# Process commits newest-first within each group.
sort_commits = "newest"
# Only include tags that look like releases.
tag_pattern = "v[0-9]*"
