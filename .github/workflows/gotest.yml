name: Go Test

on:
  push:
    branches: [dev, release/**]
  pull_request:
    branches: [main, dev, release/**]

jobs:
  go-test:
    name: Go Test
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4
        with:
          go-version: "1.26.5"

      - name: Run tests
        run: go test -short ./...
