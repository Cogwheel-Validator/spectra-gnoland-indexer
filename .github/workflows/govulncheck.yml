name: Govulncheck

on:
  push:
    branches: [dev, release/**]
  pull_request:
    branches: [main, dev, release/**]

jobs:
  govulncheck:
    name: Govulncheck
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4
        with:
          go-version: "1.26.6"

      - name: Setup Go Vulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
